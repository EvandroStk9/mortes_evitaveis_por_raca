# modules/transito/metadata.yml
module_name: "obitos_transito"
description: "Monitoramento de mortes no trnsito por raa/cor"
responsible: "CEBRAP"
data_sources:
  - name: "SIM/DATASUS"
    url: "https://datasus.saude.gov.br/mortalidade-desde-1996-pela-cid-10"
  - name: "IBGE"
    url: "https://sidra.ibge.gov.br"
indicators:
  - id: "taxa_mortalidade_transito"
    name: "Taxa de Mortalidade por Acidentes de Trnsito"
    formula: "(obitos / populacao) * 100000"
    unit: "por 100k hab"
    disaggregations:
      - "raca_cor"
      - "territorio"
      - "sexo"
