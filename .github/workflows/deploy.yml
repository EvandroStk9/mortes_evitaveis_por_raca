name: Deploy Shiny App
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      # Correção: Lista de pacotes em uma única linha para evitar erro de interpretação
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libnode-dev libx11-dev pandoc
            
      - uses: r-lib/actions/setup-renv@v2
      
      - name: Deploy to ShinyApps.io
        shell: Rscript {0}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir = ".",
            appName = "mortes-evitaveis-raca",
            forceUpdate = TRUE,
            appFiles = c("app", "data", "metadata", "main.R", ".Rprofile", "renv.lock")
          )
